name: Pruebas del videojuego

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar lógica y sprites
        run: npm test

  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Mantener la versión de la imagen alineada con Playwright en package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # El UID del runner es propietario de los directorios que monta Actions.
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Ejecutar la suite de navegador
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
