name: Pruebas del videojuego

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar lógica y sprites
        run: npm test

  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Ejecutar la suite de navegador
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
