name: Pruebas del videojuego

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar lógica y sprites
        run: npm test

  escenario-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preparar WebKit para la prueba táctil
        run: |
          npm install --prefix "$RUNNER_TEMP/navegador" playwright@1.62.1 --no-package-lock
          "$RUNNER_TEMP/navegador/node_modules/.bin/playwright" install --with-deps webkit
      - name: Probar la avenida con el perfil de iPad
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          NODE_PATH="$RUNNER_TEMP/navegador/node_modules" node tests/escenario-webkit.cjs
